name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            appstream \
            cmake \
            desktop-file-utils \
            extra-cmake-modules \
            g++ \
            libkf6coreaddons-dev \
            libkf6i18n-dev \
            libkf6iconthemes-dev \
            libkf6qqc2desktopstyle-dev \
            libkirigami-dev \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-qpa-plugins

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install to staging prefix
        run: cmake --install build --prefix "$PWD/build/stage"

      - name: Verify staged installation
        run: |
          test -x build/stage/bin/kde-workspace-manager
          test -f build/stage/share/applications/org.kde.kdeworkspacemanager.desktop
